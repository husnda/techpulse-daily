version: '3.8'

services:
  techpulse:
    build: .
    container_name: techpulse-daily
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./outputs:/app/outputs
    environment:
      - TZ=Asia/Shanghai
      # 可选注入通知密钥
      # - FEISHU_WEBHOOK=https://open.feishu.cn/open-apis/bot/v2/hook/...
      # - TELEGRAM_BOT_TOKEN=...
      # - TELEGRAM_CHAT_ID=...
      # - OPENAI_API_KEY=...
